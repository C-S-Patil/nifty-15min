name: Automated 15-Min Signal Scanner

on:
  schedule:
    # 09:15 IST = 03:45 UTC
    - cron: '45 3 * * 1-5'

    # 09:30 through 15:15 IST
    - cron: '0,15,30,45 4-9 * * 1-5'

    # 15:30 IST = 10:00 UTC
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python auto_scanner.py

name: Hourly Health Check & Scanner

on:
  schedule:
    # Runs at minute 0 past every hour (Hourly cron)
    - cron: '0 * * * *'
    # Also runs every 15 mins during market hours for trade triggers
    - cron: '*/15 3-9 * * 1-5'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Health Check
        env:
          TELEGRAM_BOT_TOKEN: 8817567694:AAGo8zFQQXFA64T5Aqazajh5o3VPfQQgshE
          TELEGRAM_CHAT_ID: 951733992
        run: python health_check.py
